<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example - 1</title>

<style>
* { box-sizing: border-box; }

:root {
  --ink: #232a1f;          /* text */
  --muted: #7a8574;        /* soft text */
  --line: #dde8d2;         /* borders */
  --card: #fcfef9;         /* box background */
  --dark: #2b3527;         /* buttons */
  --accent: #a6f27a;       /* light green, a touch lighter than #9AF562 */
}

html, body {
  max-width: 100%;
  overflow-x: hidden;
  overflow-x: clip;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #ecf7e2;
  color: var(--ink);
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 24px;
}

/* Swirl background (drawn by the script) */
#swirl {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
  background: #ecf7e2;
}

/* ---------- The big box ---------- */
.player {
  position: relative;
  width: 100%;
  max-width: 1240px;
  background: var(--card);
  padding: 32px;
  border: 1px solid var(--line);
  border-radius: 16px;
}

h1 {
  font-size: 34px;
  font-weight: 500;
  margin: 4px 0 28px;
  text-align: center;
}

/* images | divider | text */
.content {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) 1px minmax(0, 1fr);
  gap: 32px;
  align-items: start;
}

/* 2 x 2 images */
.gallery {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  min-width: 0;
}

.side {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

.side-image {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  display: block;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
}

/* Shown if an image file is missing */
.placeholder {
  width: 100%;
  aspect-ratio: 4 / 3;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 1px dashed #c3d6b3;
  border-radius: 10px;
  color: #a2b096;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-align: center;
  padding: 10px;
}

/* ---------- Divider and text on the right ---------- */
.vdivider {
  align-self: stretch;
  background: #e1ecd7;
}

.info .label {
  font-size: 11px;
  letter-spacing: 2px;
  color: #849079;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.info .description {
  color: var(--muted);
  line-height: 1.7;
  font-size: 14px;
  margin: 0 0 14px;
}

/* ---------- Small sound player ---------- */
.mini {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 12px;
}

.mini button {
  flex: none;
  width: 30px;
  height: 30px;
  border: none;
  border-radius: 50%;
  background: var(--dark);
  color: white;
  font-size: 11px;
  cursor: pointer;
  transition: transform 0.15s;
}

.mini button:hover { transform: translateY(-1px); }
.mini button:active { transform: scale(0.92); }

.mini-info {
  flex: 1;
  min-width: 0;
}

.mini-bar {
  height: 4px;
  background: #e3eed9;
  border-radius: 2px;
  cursor: pointer;
  position: relative;
}

.mini-fill {
  height: 100%;
  width: 0%;
  background: #8fdc5c;
  border-radius: 2px;
  pointer-events: none;
}

/* Tablets: text drops below the images */
@media (max-width: 900px) {
  .content {
    grid-template-columns: 1fr;
    gap: 24px;
  }
  .vdivider {
    height: 1px;
    width: 100%;
    align-self: auto;
  }
}

/* Phones: one image per row */
@media (max-width: 520px) {
  .player { padding: 20px; }
  .gallery { grid-template-columns: 1fr; }
  h1 { font-size: 28px; }
}
</style>
</head>

<body>

<canvas id="swirl"></canvas>

<main class="player">

  <h1>Example - 1</h1>

  <div class="content">

    <!-- Images: top row has the sound players, bottom row has the two new image boxes -->
    <div class="gallery">

      <div class="side">
        <img class="side-image" src="image1.png" alt="Image 1"
             onerror="this.outerHTML='<div class=&quot;placeholder&quot;>Image 1<br>(image1.png)</div>'">
        <div class="mini" data-src="abandoneddockstart.wav">
          <button class="mini-play" aria-label="Play sound">▶</button>
          <div class="mini-info"><div class="mini-bar"><div class="mini-fill"></div></div></div>
        </div>
      </div>

      <div class="side">
        <img class="side-image" src="image2.png" alt="Image 2"
             onerror="this.outerHTML='<div class=&quot;placeholder&quot;>Image 2<br>(image2.png)</div>'">
        <div class="mini" data-src="abandoneddockstart_1.wav">
          <button class="mini-play" aria-label="Play sound">▶</button>
          <div class="mini-info"><div class="mini-bar"><div class="mini-fill"></div></div></div>
        </div>
      </div>

      <div class="side">
        <img class="side-image" src="image3.png" alt="Image 3"
             onerror="this.outerHTML='<div class=&quot;placeholder&quot;>Image 3<br>(image3.png)</div>'">
      </div>

      <div class="side">
        <img class="side-image" src="image4.png" alt="Image 4"
             onerror="this.outerHTML='<div class=&quot;placeholder&quot;>Image 4<br>(image4.png)</div>'">
      </div>

    </div>

    <div class="vdivider"></div>

    <!-- Text on the right -->
    <div class="info">
      <div class="label">Section label</div>
      <p class="description">Write about these images here.</p>
      <p class="description">More text can go here.</p>
    </div>

  </div>
</main>

<script>
// ---------- Swirl background ----------
// Drawn small and stretched up by the browser, which also blurs it softly.
// It always drifts: the swirl turns, its centre wanders, the winding breathes in and out
// and the greens shift. It speeds up while a sound is playing.
const canvas = document.getElementById("swirl");
const ctx2d = canvas.getContext("2d");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const SCALE = 8;                 // 1 canvas pixel = 8 screen pixels
const ARMS = 3;                  // how many swirl arms
const TWIST = 7;                 // how tightly the arms wind up
const IDLE_SPEED = 0.18;         // radians per second when nothing is playing
const PLAY_SPEED = 0.6;          // radians per second while a sound plays

// Light base green, and two stronger greens the bands blend toward
const COLOR_A  = [236, 247, 226];
const COLOR_B1 = [176, 230, 130];
const COLOR_B2 = [200, 240, 150];

let W = 0, H = 0, image;
let clock = 0, phase = 0, spin = IDLE_SPEED, spinTarget = IDLE_SPEED;
let lastTime = performance.now();

function resizeSwirl() {
  W = Math.max(40, Math.ceil(window.innerWidth / SCALE));
  H = Math.max(40, Math.ceil(window.innerHeight / SCALE));
  canvas.width = W;
  canvas.height = H;
  image = ctx2d.createImageData(W, H);
  drawSwirl();
}

function drawSwirl() {
  const data = image.data;
  const size = Math.min(W, H);

  // The centre slowly wanders, and the winding breathes
  const cx = W / 2 + Math.sin(clock * 0.23) * W * 0.18;
  const cy = H / 2 + Math.cos(clock * 0.17) * H * 0.18;
  const twist = TWIST + Math.sin(clock * 0.12) * 2.5;

  // The stronger green slowly shifts between two shades
  const m = Math.sin(clock * 0.1) * 0.5 + 0.5;
  const B = [
    COLOR_B1[0] + (COLOR_B2[0] - COLOR_B1[0]) * m,
    COLOR_B1[1] + (COLOR_B2[1] - COLOR_B1[1]) * m,
    COLOR_B1[2] + (COLOR_B2[2] - COLOR_B1[2]) * m
  ];

  let p = 0;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const dx = x - cx, dy = y - cy;
      const angle = Math.atan2(dy, dx);
      const r = Math.sqrt(dx * dx + dy * dy) / size;

      // Arms spiral outward: the angle is shifted by how far from the middle we are
      let t = Math.sin(ARMS * angle + twist * r - phase) * 0.5 + 0.5;
      t += (Math.sin(2 * ARMS * angle - twist * 1.6 * r + phase * 0.6) * 0.5 + 0.5) * 0.35;
      t = Math.min(t / 1.35, 1);
      t = t * t * (3 - 2 * t);     // smooth the edges of the bands

      data[p]     = COLOR_A[0] + (B[0] - COLOR_A[0]) * t;
      data[p + 1] = COLOR_A[1] + (B[1] - COLOR_A[1]) * t;
      data[p + 2] = COLOR_A[2] + (B[2] - COLOR_A[2]) * t;
      data[p + 3] = 255;
      p += 4;
    }
  }
  ctx2d.putImageData(image, 0, 0);
}

function animateSwirl(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  clock += dt;
  spin += (spinTarget - spin) * Math.min(dt * 1.5, 1);
  phase += spin * dt;
  drawSwirl();

  requestAnimationFrame(animateSwirl);
}

window.addEventListener("resize", resizeSwirl);
resizeSwirl();
if (!reduceMotion) requestAnimationFrame(animateSwirl);   // people who ask for less motion get a still swirl

// ---------- Small sound players ----------
// Only one plays at a time; the swirl speeds up while any of them is playing.
const miniPlayers = [];

function anyPlaying() {
  return miniPlayers.some(p => !p.audio.paused);
}

document.querySelectorAll(".mini").forEach(root => {
  const audio = new Audio();
  audio.preload = "metadata";
  audio.src = root.dataset.src;

  const playBtn = root.querySelector(".mini-play");
  const bar = root.querySelector(".mini-bar");
  const fill = root.querySelector(".mini-fill");

  miniPlayers.push({ audio });

  playBtn.addEventListener("click", () => {
    if (audio.paused) {
      miniPlayers.forEach(p => { if (p.audio !== audio) p.audio.pause(); });
      audio.play().catch(() => {});
    } else {
      audio.pause();
    }
  });

  audio.addEventListener("play", () => {
    playBtn.textContent = "Ⅱ";
    spinTarget = PLAY_SPEED;
  });

  audio.addEventListener("pause", () => {
    playBtn.textContent = "▶";
    if (!anyPlaying()) spinTarget = IDLE_SPEED;
  });

  audio.addEventListener("ended", () => {
    playBtn.textContent = "▶";
    fill.style.width = "0%";
    if (!anyPlaying()) spinTarget = IDLE_SPEED;
  });

  audio.addEventListener("timeupdate", () => {
    if (audio.duration) fill.style.width = (audio.currentTime / audio.duration * 100) + "%";
  });

  bar.addEventListener("click", event => {
    if (!audio.duration) return;
    const rect = bar.getBoundingClientRect();
    audio.currentTime = ((event.clientX - rect.left) / rect.width) * audio.duration;
  });
});
</script>

</body>
</html>
