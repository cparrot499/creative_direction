<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example - 1</title>

<style>
* { box-sizing: border-box; }

:root {
  --ink: #232a1f;          /* text */
  --muted: #7a8574;        /* soft text */
  --line: #dde8d2;         /* borders */
  --card: #fcfef9;         /* box background */
  --dark: #2b3527;         /* buttons */
  --accent: #a6f27a;       /* light green, a touch lighter than #9AF562 */
}

html, body {
  max-width: 100%;
  overflow-x: hidden;
  overflow-x: clip;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f1f8ea;
  color: var(--ink);
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 24px;
}

/* Swirl background (drawn by the script) */
#swirl {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
  background: #f1f8ea;
}

/* ---------- Title (inside the box) ---------- */
h1 {
  grid-column: 1 / -1;
  font-size: 34px;
  font-weight: 500;
  margin: 4px 0 6px;
  text-align: center;
}

/* ---------- One big box holding the images and the sound ---------- */
.player {
  position: relative;
  width: 100%;
  max-width: 920px;
  background: var(--card);
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: start;
}

.side {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}

.side-image {
  width: 100%;
  height: auto;
  display: block;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
}

/* Shown if an image file is missing */
.placeholder {
  width: 100%;
  aspect-ratio: 4 / 3;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 1px dashed #c3d6b3;
  border-radius: 10px;
  color: #a2b096;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-align: center;
  padding: 10px;
}

/* ---------- Small sound player ---------- */
.mini {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 12px;
}

.mini button {
  flex: none;
  width: 30px;
  height: 30px;
  border: none;
  border-radius: 50%;
  background: var(--dark);
  color: white;
  font-size: 11px;
  cursor: pointer;
  transition: transform 0.15s;
}

.mini button:hover { transform: translateY(-1px); }
.mini button:active { transform: scale(0.92); }

.mini-info {
  flex: 1;
  min-width: 0;
}

.mini-bar {
  height: 4px;
  background: #e3eed9;
  border-radius: 2px;
  cursor: pointer;
  position: relative;
}

.mini-fill {
  height: 100%;
  width: 0%;
  background: #8fdc5c;
  border-radius: 2px;
  pointer-events: none;
}

@media (max-width: 700px) {
  .player {
    grid-template-columns: 1fr;
    padding: 20px;
  }
  h1 { font-size: 28px; }
}
</style>
</head>

<body>

<canvas id="swirl"></canvas>

<main class="player">

  <h1>Example - 1</h1>

  <!-- LEFT: image + small sound player underneath -->
  <div class="side">
    <img class="side-image" src="image1.png" alt="Left image"
         onerror="this.outerHTML='<div class=&quot;placeholder&quot;>Image 1<br>(image1.png)</div>'">

    <div class="mini" data-src="abandoneddockstart.wav">
      <button class="mini-play" aria-label="Play sound">▶</button>
      <div class="mini-info">
        <div class="mini-bar"><div class="mini-fill"></div></div>
      </div>
    </div>
  </div>

  <!-- RIGHT: image + small sound player underneath -->
  <div class="side">
    <img class="side-image" src="image2.png" alt="Right image"
         onerror="this.outerHTML='<div class=&quot;placeholder&quot;>Image 2<br>(image2.png)</div>'">

    <div class="mini" data-src="abandoneddockstart_1.wav">
      <button class="mini-play" aria-label="Play sound">▶</button>
      <div class="mini-info">
        <div class="mini-bar"><div class="mini-fill"></div></div>
      </div>
    </div>
  </div>

</main>
</audio>

<script>
// ---------- Swirl background ----------
// Drawn small and stretched up by the browser, which also blurs it softly.
// It only spins while the sound is playing, and eases to a stop when paused.
const canvas = document.getElementById("swirl");
const ctx2d = canvas.getContext("2d");
const SCALE = 8;                 // 1 canvas pixel = 8 screen pixels
const ARMS = 3;                  // how many swirl arms
const TWIST = 7;                 // how tightly the arms wind up
const SPIN_SPEED = 0.45;         // radians per second while playing

// Two very light greens the swirl blends between
const COLOR_A = [243, 250, 236]; // lightest
const COLOR_B = [222, 243, 202]; // a touch greener

let W = 0, H = 0, image, angles, radii;
let phase = 0, spin = 0, spinTarget = 0;
let lastTime = performance.now();
let running = false;

function resizeSwirl() {
  W = Math.max(40, Math.ceil(window.innerWidth / SCALE));
  H = Math.max(40, Math.ceil(window.innerHeight / SCALE));
  canvas.width = W;
  canvas.height = H;
  image = ctx2d.createImageData(W, H);
  angles = new Float32Array(W * H);
  radii = new Float32Array(W * H);

  const cx = W / 2, cy = H / 2, size = Math.min(W, H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const dx = x - cx, dy = y - cy;
      angles[y * W + x] = Math.atan2(dy, dx);
      radii[y * W + x] = Math.sqrt(dx * dx + dy * dy) / size;
    }
  }
  drawSwirl();
}

function drawSwirl() {
  const data = image.data;
  for (let i = 0; i < angles.length; i++) {
    const r = radii[i];
    // Arms spiral outward: the angle is shifted by how far from the middle we are
    let t = Math.sin(ARMS * angles[i] + TWIST * r - phase) * 0.5 + 0.5;
    t += (Math.sin(2 * ARMS * angles[i] - TWIST * 1.6 * r + phase * 0.6) * 0.5 + 0.5) * 0.35;
    t = Math.min(t / 1.35, 1);
    t = t * t * (3 - 2 * t);     // smooth the edges of the bands

    const p = i * 4;
    data[p]     = COLOR_A[0] + (COLOR_B[0] - COLOR_A[0]) * t;
    data[p + 1] = COLOR_A[1] + (COLOR_B[1] - COLOR_A[1]) * t;
    data[p + 2] = COLOR_A[2] + (COLOR_B[2] - COLOR_A[2]) * t;
    data[p + 3] = 255;
  }
  ctx2d.putImageData(image, 0, 0);
}

function animateSwirl(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  spin += (spinTarget - spin) * Math.min(dt * 1.5, 1);
  phase += spin * dt;
  drawSwirl();

  if (spinTarget === 0 && Math.abs(spin) < 0.003) {
    running = false;             // fully stopped: stop drawing to save battery
    return;
  }
  requestAnimationFrame(animateSwirl);
}

function startSwirl() {
  if (reduceMotion) return;
  if (!running) {
    running = true;
    lastTime = performance.now();
    requestAnimationFrame(animateSwirl);
  }
}

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
window.addEventListener("resize", resizeSwirl);
resizeSwirl();

// ---------- Small sound players ----------
// Only one plays at a time; the swirl spins while any of them is playing.
const miniPlayers = [];

function anyPlaying() {
  return miniPlayers.some(p => !p.audio.paused);
}

document.querySelectorAll(".mini").forEach(root => {
  const audio = new Audio();
  audio.preload = "metadata";
  audio.src = root.dataset.src;

  const playBtn = root.querySelector(".mini-play");
  const bar = root.querySelector(".mini-bar");
  const fill = root.querySelector(".mini-fill");

  miniPlayers.push({ audio });

  playBtn.addEventListener("click", () => {
    if (audio.paused) {
      miniPlayers.forEach(p => { if (p.audio !== audio) p.audio.pause(); });
      audio.play().catch(() => {});
    } else {
      audio.pause();
    }
  });

  audio.addEventListener("play", () => {
    playBtn.textContent = "Ⅱ";
    spinTarget = SPIN_SPEED;
    startSwirl();
  });

  audio.addEventListener("pause", () => {
    playBtn.textContent = "▶";
    if (!anyPlaying()) spinTarget = 0;
  });

  audio.addEventListener("ended", () => {
    playBtn.textContent = "▶";
    fill.style.width = "0%";
    if (!anyPlaying()) spinTarget = 0;
  });

  audio.addEventListener("timeupdate", () => {
    if (audio.duration) fill.style.width = (audio.currentTime / audio.duration * 100) + "%";
  });

  bar.addEventListener("click", event => {
    if (!audio.duration) return;
    const rect = bar.getBoundingClientRect();
    audio.currentTime = ((event.clientX - rect.left) / rect.width) * audio.duration;
  });
});
</script>

</body>
</html>
